[project]
name = "aether-rag"
version = "0.1.0"
description = "Model-agnostic enterprise RAG engine: hybrid retrieval, entity graph, cited answers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "prj1010" }]
keywords = ["rag", "retrieval", "enterprise", "citations"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
aether = "aether.cli:main"

[project.urls]
Homepage = "https://github.com/prj1010/aether"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aether = ["py.typed", "data/*.json"]
